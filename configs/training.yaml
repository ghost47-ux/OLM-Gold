training:
  seed: 7
  batch_size: 64
  eval_batch_size: 128
  epochs: 30
  max_steps: 0
  lr: 0.0006
  weight_decay: 0.01
  grad_clip: 1.0
  scheduler: cosine
  warmup_steps: 200
  min_lr_ratio: 0.05
  patience: 6
  min_delta: 0.0001
  num_workers: 0
  lambda_parent: 1.0
  lambda_child: 1.0
  lambda_aggregate: 0.5
  lambda_consistency: 0.25
  checkpoint_dir: artifacts/checkpoints
  run_dir: artifacts/runs
  log_every: 20
  eval_samples: 8
  day_balance: true
  device: auto
